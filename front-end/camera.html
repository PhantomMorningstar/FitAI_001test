<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAI - Camera</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-top-bar">
            <span class="app-brand-name">Fit<span class="highlight">AI</span></span>
        </header>
        <main class="app-main-content">
            <div class="content-max-width">
                <div class="page-header">
                    <h2>Camera</h2>
                    <p class="subtitle">Upload a meal photo and get instant nutrition analysis.</p>
                </div>
                <div class="section-card grid-2-columns">
                    <div class="upload-zone">
                        <input type="file" id="food-upload" accept="image/*" hidden>
                        <label for="food-upload" class="upload-label" style="cursor: pointer; display: block;">
                            <i class="fa-solid fa-camera" style="font-size: 46px; color: var(--primary-color);"></i>
                            <p style="margin-top: 12px; font-weight: 500;">Take a photo or upload a meal image</p>
                        </label>
                        <button type="button" class="btn btn-secondary" id="upload-image-btn" style="margin-top: 12px; width:100%;">Upload Image</button>
                        <button type="button" class="btn btn-primary" id="recognize-food-btn" style="margin-top: 12px; width:100%;" disabled>Recognize Food</button>
                        <img id="food-preview" src="#" alt="Preview" style="display:none; max-width:100%; max-height: 250px; border-radius: 12px; margin-top:15px; margin-left: auto; margin-right: auto;">
                    </div>
                    <div class="food-analysis" id="analysis-result" style="display: none; text-align: center; display: flex; flex-direction: column; justify-content: center;">
                        <h4 style="color:#2ecc71;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Analysis Result:</h4>
                        <div class="food-name" style="font-size: 22px; font-weight: bold; margin: 12px 0;" id="analysis-food-name">...</div>
                        <div class="nutrition-grid" style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-bottom:12px;">
                            <div class="calorie-tag" style="background: rgba(46,204,113,0.15); color:#2ecc71; padding:6px 20px; border-radius:20px; font-weight:bold;">Calories: <span id="analysis-calories">-- kcal</span></div>
                            <div class="calorie-tag" style="background: rgba(46,204,113,0.1); color:#2ecc71; padding:6px 20px; border-radius:20px; font-weight:bold;">Protein: <span id="analysis-protein">-- g</span></div>
                            <div class="calorie-tag" style="background: rgba(46,204,113,0.1); color:#2ecc71; padding:6px 20px; border-radius:20px; font-weight:bold;">Fiber: <span id="analysis-fiber">-- g</span></div>
                        </div>
                        <button class="btn btn-primary" id="add-food-btn" style="margin-top: 20px; width:100%;" disabled>+ Add to Diary</button>
                    </div>
                </div>
            </div>
        </main>
        <nav class="bottom-nav">
            <div class="nav-content-container">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Overview</span></a>
                <a href="roadmap.html" class="nav-item"><i class="fa-solid fa-route"></i><span>Roadmap</span></a>
                <a href="camera.html" class="nav-item action-btn-wrapper active"><div class="action-circle-btn"><i class="fa-solid fa-camera"></i></div><span>Camera</span></a>
                <a href="diary.html" class="nav-item"><i class="fa-solid fa-book-bookmark"></i><span>Diary</span></a>
                <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
            </div>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
