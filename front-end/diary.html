<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAI - Diary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

</head>
<body>
    <div class="app-container">
        <header class="app-top-bar">
            <span class="app-brand-name">Fit<span class="highlight">AI</span></span>

                <div class="section-card">

                    <ul class="food-list" id="diary-list" style="list-style: none; padding: 0; margin-top: 15px;"></ul>

            </div>
        </main>
        <nav class="bottom-nav">
            <div class="nav-content-container">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Overview</span></a>
